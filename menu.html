<style>
:root{
  --cream:#F2EEE3; --cream2:#FBF8F1; --card:#FFFFFF;
  --green:#91BE25; --green-deep:#4E6A10;
  --ink:#2B2620; --muted:#6E665C; --line:rgba(43,38,32,.14);
  --f-display:'Playfair Display',Georgia,serif;
  --f-body:'Jost','Helvetica Neue',Arial,sans-serif;
  --f-ar:'Cairo',system-ui,sans-serif;
  --head-h:140px;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:calc(var(--head-h) + 14px)}
body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--f-body);
  font-weight:300;font-size:16px;line-height:1.6;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
html[lang="ar"] body{font-family:var(--f-ar);font-weight:400}
img{max-width:100%;display:block}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
[hidden]{display:none!important}
::selection{background:var(--green);color:var(--ink)}
.wrap{width:100%;max-width:1280px;margin-inline:auto;padding-inline:18px}
@media(min-width:900px){.wrap{padding-inline:32px}}
.display{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;line-height:1.08}
html[lang="ar"] .display{font-family:var(--f-ar);font-weight:900;letter-spacing:0}

/* ---------- HEADER ---------- */
.hd{position:fixed;inset-inline:0;top:0;z-index:80;background:rgba(242,238,227,.94);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top,0px)}
.hd-top{display:flex;align-items:center;gap:10px;min-height:68px;padding-block:10px}
.back{display:flex;align-items:center;justify-content:center;width:42px;height:42px;flex:none;
  border:1px solid var(--line);border-radius:999px 999px 12px 999px;transition:background .25s,color .25s}
.back:hover{background:var(--ink);color:var(--cream)}
.back svg{width:17px;height:17px}
html[dir="rtl"] .back svg{transform:scaleX(-1)}
.logo{display:flex;align-items:center;gap:9px;margin-inline-end:auto;min-width:0}
.logo img{height:38px;width:auto}
.logo b{font-family:var(--f-display);font-size:17px;letter-spacing:.06em;white-space:nowrap;color:var(--ink)}
html[lang="ar"] .logo b{font-family:var(--f-ar);font-weight:900;letter-spacing:0}
@media(max-width:520px){.logo b{display:none}}
.srch{display:flex;align-items:center;gap:9px;background:var(--card);
  border:1px solid var(--line);border-radius:999px;padding:10px 16px;flex:1;max-width:330px;min-width:0}
.srch svg{width:17px;height:17px;color:var(--green-deep);flex:none}
.srch input{flex:1;min-width:0;border:0;outline:0;background:none;font:inherit;font-size:15px;color:var(--ink)}
.srch input::placeholder{color:var(--muted)}
.lang{display:flex;align-items:center;gap:6px;border:1px solid var(--line);
  color:var(--ink);border-radius:999px 999px 12px 999px;padding:9px 15px;font-size:13px;font-weight:500;flex:none;
  transition:background .25s,color .25s}
html[lang="ar"] .lang{font-weight:700}
.lang:hover{background:var(--ink);color:var(--cream)}
.wa-hd{display:flex;align-items:center;gap:7px;background:var(--green);color:var(--ink);
  border-radius:999px 999px 12px 999px;padding:10px 16px;font-size:13px;font-weight:500;flex:none;
  transition:background .25s,color .25s}
html[lang="ar"] .wa-hd{font-weight:700}
.wa-hd:hover{background:var(--green-deep);color:var(--cream)}
.wa-hd svg{width:16px;height:16px}
@media(max-width:820px){.wa-hd span{display:none}.wa-hd{padding:10px 13px}}
@media(max-width:620px){
  .srch{order:3;flex-basis:100%;max-width:none;margin-bottom:10px}
  .hd-top{flex-wrap:wrap;padding-top:12px}
}

/* tabs */
.tabs{display:flex;gap:7px;overflow-x:auto;padding:0 0 12px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:9px 16px;
  font-size:13.5px;font-weight:500;color:var(--muted);white-space:nowrap;transition:.2s}
html[lang="ar"] .tab{font-weight:700;font-size:14px}
.tab:hover{border-color:var(--green);color:var(--ink)}
.tab.on{background:var(--green);border-color:var(--green);color:var(--ink);font-weight:600}
html[lang="ar"] .tab.on{font-weight:900}

/* ---------- MENU ---------- */
main{padding-top:calc(var(--head-h) + 26px);padding-bottom:80px}
.intro{text-align:center;max-width:60ch;margin:0 auto 44px}
.intro .eyebrow{display:block;font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--green-deep);margin-bottom:14px;font-weight:500}
html[lang="ar"] .intro .eyebrow{letter-spacing:.03em;text-transform:none;font-size:.88rem;font-weight:700}
.intro h1{margin:0;font-size:clamp(2rem,5vw,3.2rem);text-transform:uppercase}
html[lang="ar"] .intro h1{text-transform:none}
.intro p{margin:16px auto 0;color:rgba(43,38,32,.8);font-size:1rem}

.cat{margin-bottom:56px;scroll-margin-top:calc(var(--head-h) + 16px)}
.cat-h{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.cat-h .ic{width:48px;height:48px;border-radius:16px 4px 16px 4px;background:var(--green);
  color:var(--ink);display:flex;align-items:center;justify-content:center;flex:none}
.cat-h .ic svg{width:25px;height:25px}
.cat-h h2{margin:0;font-size:clamp(22px,4.2vw,32px);text-transform:uppercase}
html[lang="ar"] .cat-h h2{text-transform:none}
.cat-h .n{font-size:12.5px;font-weight:500;color:var(--muted);white-space:nowrap}
html[lang="ar"] .cat-h .n{font-weight:700;font-size:13.5px}
.cat-h::after{content:"";flex:1;height:1px;background:var(--line)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));gap:16px}
@media(max-width:640px){.grid{grid-template-columns:repeat(2,1fr);gap:12px}}
@media(max-width:360px){.grid{grid-template-columns:1fr}}

.card{background:var(--card);border:1px solid var(--line);border-radius:22px 6px 22px 6px;overflow:hidden;
  display:flex;flex-direction:column;text-align:start;transition:transform .25s,box-shadow .25s,border-color .25s}
.card:nth-child(even){border-radius:6px 22px 6px 22px}
.card:hover{transform:translateY(-4px);border-color:var(--green);box-shadow:0 18px 38px -22px rgba(43,38,32,.45)}
.ph{position:relative;aspect-ratio:1/1;background:var(--cream2);overflow:hidden;cursor:pointer}
.ph img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.card:hover .ph img{transform:scale(1.05)}
.ph .fallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(145deg,var(--cream2),#E9E2D2)}
.ph .fallback svg{width:42%;height:42%;color:var(--green-deep);opacity:.45}
.cbody{padding:13px 14px 14px;display:flex;flex-direction:column;gap:3px;flex:1;cursor:pointer}
.cbody b{font-size:14.5px;font-weight:600;line-height:1.35;color:var(--ink)}
html[lang="ar"] .cbody b{font-weight:700;font-size:15px}
.cbody i{font-style:normal;font-size:12.5px;color:var(--muted);line-height:1.4;unicode-bidi:plaintext;text-align:start}
.cbody .pr{margin-top:auto;padding-top:9px;font-family:var(--f-display);font-weight:700;
  font-size:19px;color:var(--green-deep)}
html[lang="ar"] .cbody .pr{font-family:var(--f-ar);font-weight:900}
.cbody .pr span{font-size:11.5px;font-weight:500;font-family:var(--f-body);opacity:.85}
html[lang="ar"] .cbody .pr span{font-family:var(--f-ar);font-weight:700}
.order{display:flex;align-items:center;justify-content:center;gap:7px;margin:0 14px 14px;
  background:var(--green);color:var(--ink);border-radius:999px 999px 10px 999px;
  padding:11px 14px;font-size:12.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  transition:background .22s,color .22s}
html[lang="ar"] .order{text-transform:none;letter-spacing:0;font-weight:700;font-size:13.5px}
.order:hover{background:var(--green-deep);color:var(--cream)}
.order svg{width:15px;height:15px;flex:none}

.empty{padding:70px 20px;text-align:center;color:var(--muted);font-size:17px}

/* ---------- DETAIL OVERLAY ---------- */
.ov{position:fixed;inset:0;z-index:120;background:rgba(43,38,32,.45);backdrop-filter:blur(5px);
  display:none;align-items:center;justify-content:center;padding:20px}
.ov.on{display:flex}
.ov-in{background:var(--cream2);border-radius:24px 8px 24px 8px;overflow:hidden;max-width:450px;width:100%;
  max-height:90svh;overflow-y:auto;animation:rise .3s cubic-bezier(.22,1,.36,1);border:1px solid var(--line)}
@keyframes rise{from{opacity:0;transform:translateY(22px) scale(.97)}}
.ov-ph{aspect-ratio:4/3;background:var(--cream);position:relative}
.ov-ph img{width:100%;height:100%;object-fit:cover}
.ov-ph .fallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(145deg,var(--cream2),#E9E2D2)}
.ov-ph .fallback svg{width:36%;height:36%;color:var(--green-deep);opacity:.45}
.ov-bd{padding:22px 24px 26px}
.ov-bd h3{margin:0 0 4px;font-size:21px;line-height:1.3;font-family:var(--f-display);font-weight:700;color:var(--ink)}
html[lang="ar"] .ov-bd h3{font-family:var(--f-ar);font-weight:900}
.ov-bd .alt{margin:0;color:var(--muted);font-size:14.5px;unicode-bidi:plaintext;text-align:start}
.ov-bd .dsc{margin:14px 0 0;color:rgba(43,38,32,.82);font-size:14.5px;line-height:1.7}
.ov-bd .pr{margin-top:18px;font-family:var(--f-display);font-weight:700;font-size:30px;color:var(--green-deep)}
html[lang="ar"] .ov-bd .pr{font-family:var(--f-ar);font-weight:900}
.ov-bd .pr span{font-size:14px;font-weight:500;font-family:var(--f-body)}
html[lang="ar"] .ov-bd .pr span{font-family:var(--f-ar);font-weight:700}
.ov-bd .order{margin:20px 0 0;padding:15px;font-size:13.5px}
html[lang="ar"] .ov-bd .order{font-size:15px}
.ov-x{position:absolute;top:12px;inset-inline-end:12px;width:40px;height:40px;border-radius:50%;
  background:rgba(43,38,32,.55);color:#fff;display:flex;align-items:center;justify-content:center}
.ov-x svg{width:20px;height:20px}

/* ---------- FOOTER / TOP ---------- */
.ft{background:var(--cream2);border-top:1px solid var(--line);color:var(--muted);
  text-align:center;padding:34px 18px;font-size:13px}
.ft a{color:var(--green-deep);font-weight:500}
.ft .fwa{display:inline-flex;align-items:center;gap:8px;margin-bottom:14px;background:var(--green);color:var(--ink);
  border-radius:999px 999px 12px 999px;padding:13px 24px;font-size:13px;font-weight:600;
  transition:background .25s,color .25s}
html[lang="ar"] .ft .fwa{font-weight:700;font-size:14px}
.ft .fwa:hover{background:var(--green-deep);color:var(--cream)}
.ft .fwa svg{width:17px;height:17px}
.top{position:fixed;inset-inline-end:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:70;
  width:48px;height:48px;border-radius:50%;background:var(--ink);color:var(--green);display:none;
  align-items:center;justify-content:center;box-shadow:0 12px 26px -12px rgba(43,38,32,.75)}
.top.on{display:flex}
.top svg{width:22px;height:22px}

.rv{opacity:0;transform:translateY(18px);transition:opacity .6s,transform .6s}
.rv.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
  .rv{opacity:1;transform:none}
}
</style>
</head>

 egg:S+'<path d="M12 3c3.3 0 6 4.5 6 9a6 6 0 0 1-12 0c0-4.5 2.7-9 6-9Z"/></svg>',

 pancake:S+'<ellipse cx="12" cy="8" rx="8" ry="3"/><path d="M4 8v3c0 1.7 3.6 3 8 3s8-1.3 8-3V8"/><path d="M4 13v3c0 1.7 3.6 3 8 3s8-1.3 8-3v-3"/></svg>',
 icecream:S+'<path d="M8 10a4 4 0 0 1 8 0Z"/><path d="M8.5 10.5 12 20l3.5-9.5"/></svg>',
 fruit:S+'<circle cx="12" cy="14" r="6"/><path d="M12 8c0-2 1.4-3.5 3.5-3.8"/></svg>',
 shake:S+'<path d="M7.5 9h9l-1 10.2a1 1 0 0 1-1 .8h-5a1 1 0 0 1-1-.8Z"/><path d="M9 6c0-1.4 1.3-2.5 3-2.5S15 4.6 15 6"/></svg>',
 smoothie:S+'<path d="M7.5 9h9l-1 10.2a1 1 0 0 1-1 .8h-5a1 1 0 0 1-1-.8Z"/><path d="M12 9V4.5M12 4.5l3-1.5"/></svg>',
 mojito:S+'<path d="M5 6h14l-6 7v6"/><path d="M9.5 19h5"/><path d="M16 4.5c1.5.6 2.2 2 2 3.5"/></svg>',
 frappe:S+'<path d="M7 8h10l-1 11.2a1 1 0 0 1-1 .8H9a1 1 0 0 1-1-.8Z"/><path d="M8.5 5.5c1-1.2 2-1.2 3 0s2 1.2 3 0 2-1.2 3 0"/></svg>',
 bubble:S+'<path d="M7 7h10l-1 12.2a1 1 0 0 1-1 .8H9a1 1 0 0 1-1-.8Z"/><circle cx="10.5" cy="16" r="1"/><circle cx="13.5" cy="17" r="1"/></svg>',
 icecoffee:S+'<path d="M7 7h10l-1 12.2a1 1 0 0 1-1 .8H9a1 1 0 0 1-1-.8Z"/><path d="M9.5 10.5h5M9.5 14h5"/></svg>',
 coffee:S+'<path d="M4 8h13v6a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5Z"/><path d="M17 10h1.8a2.2 2.2 0 1 1 0 4.4H17"/><path d="M8 4.5c0 1-1 1-1 2M12 4.5c0 1-1 1-1 2"/></svg>'
};
function icon(k){ return ICON[k]||ICON.all; }

var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};
var tx=function(k){return T[lang][k];};
var cur=function(){return lang==="ar"?CONFIG.currencyAr:CONFIG.currency;};
var nm=function(o){return lang==="ar"?(o.ar||o.en):(o.en||o.ar);};
var alt=function(o){return lang==="ar"?(o.en||''):(o.ar||'');};
var dsc=function(o){return lang==="ar"?(o.dAr||o.d||''):(o.d||o.dAr||'');};
function fmt(n){ n=Number(n)||0; return (n%1===0)?String(n):n.toFixed(2); }
function waDigits(){ return String(CONFIG.whatsapp).replace(/\D/g,''); }
function waLink(msg){ return 'https://wa.me/'+waDigits()+'?text='+encodeURIComponent(msg); }
function itemMsg(it){
  var head = lang==="ar" ? 'مرحباً بابا غنوج 👋 بدي أطلب:' : 'Hello Baba Ghanouj 👋 I would like to order:';
  var price = lang==="ar" ? (fmt(it.p)+' '+CONFIG.currencyAr) : (CONFIG.currency+' '+fmt(it.p));
  return head+' '+(it.ar||'')+((it.ar&&it.en)?' / ':'')+(it.en||'')+' — '+price;
}

/* ---------- language ---------- */
function detect(){
  var u=new URLSearchParams(location.search).get("lang");
  if(u==="ar"||u==="en") return u;
  var p=location.pathname.toLowerCase();
  if(/(^|\/)ar\/?$/.test(p)) return "ar";
  if(/(^|\/)en\/?$/.test(p)) return "en";
  if(location.hash==="#ar") return "ar";
  if(location.hash==="#en") return "en";
  try{ var s=localStorage.getItem("bg_lang"); if(s) return s; }catch(e){}
  return (navigator.languages||[navigator.language||"en"]).some(function(l){return /^ar\b/i.test(l);})?"ar":"en";
}
function setLang(L,save){
  lang=L;
  var h=document.documentElement; h.lang=L; h.dir=(L==="ar")?"rtl":"ltr";
  if(save){ try{localStorage.setItem("bg_lang",L);}catch(e){} }
  $("#langTxt").textContent = (L==="ar")?"EN":"العربية";
  $("#brandName").textContent = (L==="ar")?CONFIG.nameAr:CONFIG.name;
  $("#q").placeholder = tx("search");
  $("#introEy").textContent = tx("ey");
  $("#introH").textContent  = tx("h");
  $("#introP").textContent  = tx("p");
  $("#waTopTxt").textContent = tx("wa");
  $("#waFootTxt").textContent = tx("wa")+" · +"+waDigits();
  $("#ovOrderTxt").textContent = tx("order");
  $("#backLink").href = CONFIG.homePage+"?lang="+L;
  $("#backLink").setAttribute("aria-label",tx("home"));
  document.title = ((L==="ar")?CONFIG.nameAr:CONFIG.name)+" | "+tx("h");
  $("#foot").textContent = "© "+new Date().getFullYear()+" "+((L==="ar")?CONFIG.nameAr:CONFIG.name)+" · "+tx("foot");
  var greet = (L==="ar") ? 'مرحباً بابا غنوج 👋 بدي أعمل طلب' : 'Hello Baba Ghanouj 👋 I would like to place an order';
  $("#waTop").href = waLink(greet);
  $("#waFoot").href = waLink(greet);
  var u=new URL(location.href); u.searchParams.set("lang",L); history.replaceState(null,"",u.toString());
  drawTabs(); drawMenu(); apply(); renderLd();
}

/* ---------- render ---------- */
function cats(){ return (DATA&&DATA.categories)?DATA.categories.filter(function(c){return c.items&&c.items.length;}):[]; }

function drawTabs(){
  $("#tabs").innerHTML='<button class="tab'+(cat==="all"?" on":"")+'" data-c="all">'+esc(tx("all"))+'</button>'+
    cats().map(function(c){
      return '<button class="tab'+(cat===c.slug?" on":"")+'" data-c="'+esc(c.slug)+'">'+esc(lang==="ar"?c.ar:c.en)+'</button>';
    }).join("");
  $$("#tabs .tab").forEach(function(b){
    b.onclick=function(){
      cat=b.getAttribute("data-c");
      $$("#tabs .tab").forEach(function(x){x.classList.toggle("on",x===b);});
      apply();
      if(cat!=="all"){ var el=document.getElementById("c-"+cat); if(el) el.scrollIntoView({block:"start"}); }
      else window.scrollTo({top:0});
    };
  });
}

function drawMenu(){
  $("#menu").innerHTML = cats().map(function(c){
    var cards=c.items.map(function(it,i){
      var fb='<span class="fallback">'+icon(c.icon)+'</span>';
      var ph = it.img
        ? '<img src="'+esc(it.img)+'" alt="'+esc(nm(it))+'" loading="lazy" width="400" height="400" onerror="this.parentNode.innerHTML=this.parentNode.dataset.fb">'
        : fb;
      return '<article class="card rv" data-cat="'+esc(c.slug)+'" data-i="'+i+'" data-s="'+esc(((it.en||"")+" "+(it.ar||"")+" "+(it.d||"")+" "+(it.dAr||"")).toLowerCase())+'">'
        +'<span class="ph open" data-fb="'+esc(fb)+'">'+ph+'</span>'
        +'<span class="cbody open"><b>'+esc(nm(it))+'</b><i dir="auto">'+esc(alt(it))+'</i>'
        +'<span class="pr">'+fmt(it.p)+' <span>'+esc(cur())+'</span></span></span>'
        +'<a class="order" href="'+waLink(itemMsg(it))+'" target="_blank" rel="noopener">'
        + S+'<path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.5 8.5 0 0 1-4-1L3 20l1.1-4.9A8.4 8.4 0 0 1 3 11.5a8.4 8.4 0 0 1 9-8.4 8.4 8.4 0 0 1 9 8.4Z"/></svg>'
        +'<span>'+esc(tx("order"))+'</span></a>'
        +'</article>';
    }).join("");
    return '<section class="cat" id="c-'+esc(c.slug)+'" data-c="'+esc(c.slug)+'">'
      +'<div class="cat-h"><span class="ic">'+icon(c.icon)+'</span>'
      +'<h2 class="display">'+esc(lang==="ar"?c.ar:c.en)+'</h2>'
      +'<span class="n">'+c.items.length+' '+esc(tx("items"))+'</span></div>'
      +'<div class="grid">'+cards+'</div></section>';
  }).join("");
  $("#empty").textContent = tx("none");
  $$(".open").forEach(function(el){
    el.onclick=function(){
      var card=el.closest(".card");
      openItem(card.getAttribute("data-cat"), +card.getAttribute("data-i"));
    };
  });
  reveal();
}

function apply(){
  var s=q.trim().toLowerCase(), shown=0;
  $$(".cat").forEach(function(sec){
    var catOk = (cat==="all") || (sec.getAttribute("data-c")===cat);
    var n=0;
    $$(".card",sec).forEach(function(c){
      var ok = catOk && (!s || c.getAttribute("data-s").indexOf(s)>-1);
      c.style.display = ok?"":"none"; if(ok) n++;
    });
    sec.style.display = n?"":"none"; shown+=n;
  });
  $("#empty").hidden = shown>0;
}

function openItem(slug,i){
  var c=cats().filter(function(x){return x.slug===slug;})[0]; if(!c) return;
  var it=c.items[i]; if(!it) return;
  var ph=$("#ovPh");
  $$("img,.fallback",ph).forEach(function(n){n.remove();});
  if(it.img){
    var im=document.createElement("img");
    im.src=it.img; im.alt=nm(it);
    im.onerror=function(){ im.remove(); ph.insertAdjacentHTML("afterbegin",'<span class="fallback">'+icon(c.icon)+'</span>'); };
    ph.insertAdjacentElement("afterbegin",im);
  } else {
    ph.insertAdjacentHTML("afterbegin",'<span class="fallback">'+icon(c.icon)+'</span>');
  }
  $("#ovT").textContent=nm(it);
  $("#ovS").textContent=alt(it);
  var d=dsc(it); $("#ovD").textContent=d; $("#ovD").hidden=!d;
  $("#ovP").innerHTML=fmt(it.p)+' <span>'+esc(cur())+'</span>';
  $("#ovOrder").href=waLink(itemMsg(it));
  $("#ovOrderTxt").textContent=tx("order");
  $("#ov").classList.add("on");
  document.body.style.overflow="hidden";
}
function closeOv(){ $("#ov").classList.remove("on"); document.body.style.overflow=""; }
$("#ovX").onclick=closeOv;
$("#ov").onclick=function(e){ if(e.target===$("#ov")) closeOv(); };
addEventListener("keydown",function(e){ if(e.key==="Escape") closeOv(); });

function reveal(){
  if(!("IntersectionObserver" in window)){ $$(".rv").forEach(function(el){el.classList.add("in");}); return; }
  var io=new IntersectionObserver(function(es){
    es.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target); } });
  },{threshold:.05,rootMargin:"0px 0px -30px"});
  $$(".rv").forEach(function(el){ io.observe(el); });
}

function renderLd(){
  var ar=(lang==="ar");
  var sections=cats().map(function(c){
    return {"@type":"MenuSection","name":(ar?c.ar:c.en),
      "hasMenuItem":c.items.slice(0,40).map(function(it){
        return {"@type":"MenuItem","name":(ar?it.ar:it.en),"description":(ar?it.dAr:it.d)||undefined,
                "offers":{"@type":"Offer","price":String(it.p),"priceCurrency":"AED"}};
      })};
  });
  $("#ldjson").textContent=JSON.stringify({
    "@context":"https://schema.org","@type":"Menu",
    "name":ar?"قائمة مطعم بابا غنوج":"Baba Ghanouj Menu",
    "inLanguage":ar?"ar":"en",
    "url":"https://baba-ghanouj.com/menu.html",
    "hasMenuSection":sections
  });
}

/* ---------- wiring ---------- */
$("#langBtn").onclick=function(){ setLang(lang==="ar"?"en":"ar",true); };
$("#q").addEventListener("input",function(e){ q=e.target.value; apply(); });
addEventListener("scroll",function(){ $("#top").classList.toggle("on",scrollY>700); },{passive:true});
$("#top").onclick=function(){ window.scrollTo({top:0,behavior:"smooth"}); };
function headH(){ document.documentElement.style.setProperty("--head-h",$(".hd").offsetHeight+"px"); }
addEventListener("resize",headH);

/* ---------- boot ---------- */
function boot(d){
  DATA = (d && d.categories) ? d : {config:{},categories:[]};
  if(DATA.config){
    if(DATA.config.name) CONFIG.name=DATA.config.name;
    if(DATA.config.nameAr) CONFIG.nameAr=DATA.config.nameAr;
    if(DATA.config.currency) CONFIG.currency=DATA.config.currency;
    if(DATA.config.currencyAr) CONFIG.currencyAr=DATA.config.currencyAr;
  }
  setLang(detect(),false);
  headH();
}
fetch(CONFIG.menuFile,{cache:"no-store"})
  .then(function(r){ if(!r.ok) throw 0; return r.json(); })
  .then(boot)
  .catch(function(){ boot(MENU_FALLBACK); });
})();
</script>
</body>
</html>
